name: Build Florida

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  android_build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r29
        local-cache: false
        link-to-sdk: true

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: install dependencies
      run: |
        sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 -y
        sudo gem install fpm -v 1.11.0 --no-document
        python3 -m pip install "lief>=0.13,<1.0" graphlib_backport

    - name: Clone frida source
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git clone --recurse-submodules https://github.com/frida/frida

    - name: Apply Florida patches
      run: |
        chmod +x apply_patches.sh
        ./apply_patches.sh "$GITHUB_WORKSPACE/frida" "$GITHUB_WORKSPACE/patches"

    - name: Build frida for Android arm64
      run: |
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
        mkdir build-android-arm64
        cd build-android-arm64
        ../frida/configure --host=android-arm64
        make

    - name: Post-build anti-detection patching
      run: |
        echo "=== Running post-build anti-detection patching ==="
        python3 post_build_patch.py build-android-arm64
        echo "=== Verifying patch results ==="
        echo "frida string count in frida-server:"
        strings build-android-arm64/subprojects/frida-core/server/frida-server | grep -c "frida" || echo "0"
        echo "frida-agent string check:"
        strings build-android-arm64/subprojects/frida-core/server/frida-server | grep "frida-agent" | head -5 || echo "none found"
        echo "re.frida.server check:"
        strings build-android-arm64/subprojects/frida-core/server/frida-server | grep "re.frida.server" | head -5 || echo "none found"

    - name: Package build results
      run: |
        gzip -k build-android-arm64/subprojects/frida-core/server/frida-server
        gzip -k build-android-arm64/subprojects/frida-core/inject/frida-inject
        gzip -k build-android-arm64/subprojects/frida-core/lib/gadget/frida-gadget.so

    - name: Upload frida-server
      uses: actions/upload-artifact@v4
      with:
        name: florida-server-android-arm64
        path: build-android-arm64/subprojects/frida-core/server/frida-server

    - name: Upload frida-server (gzipped)
      uses: actions/upload-artifact@v4
      with:
        name: florida-server-android-arm64-gz
        path: build-android-arm64/subprojects/frida-core/server/frida-server.gz

    - name: Upload frida-inject
      uses: actions/upload-artifact@v4
      with:
        name: florida-inject-android-arm64
        path: build-android-arm64/subprojects/frida-core/inject/frida-inject

    - name: Upload frida-gadget
      uses: actions/upload-artifact@v4
      with:
        name: florida-gadget-android-arm64
        path: build-android-arm64/subprojects/frida-core/lib/gadget/frida-gadget.so
